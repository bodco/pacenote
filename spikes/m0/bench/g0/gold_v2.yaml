# PB-52 G2 (S2): G0 gold version 2 (spec section 14.2), invented data only, the same two clients plus a late third.
#
# A separate file next to gold.yaml (version 1): the existing columns keep their gold and fixture hashes, so an A run
# stays comparable 1:1 with every earlier A result, and this file's full sha256 is the frozen gold hash every results
# JSON carries (section 14.2 "Gold freeze": frozen when S2 merges; a later change is a new version).
#
# The project of these rows is fixtures/northpoint plus fixtures/v2/files, built at run time in passes (run.py v2
# timeline): the base pass, the revision states of fixtures/revisions/revisions.yaml in time order, the move of the
# flat ops sync call (call_layout.migrate), the deletions, the supersede override through the CLI, then the state-only
# pass with the hidden call and the revoked page. The PM-excluded file is passed in every request's `exclude`, the way
# the app passes the PM's excluded files with a request.
#
# Matching (run.py > has_phrase): lower case, whitespace collapsed, on word boundaries; a fact is any of its phrases.
# Every row:
#   needs     the first sub-task whose code lets C answer it (S2, S3 or S4); A and B are evaluated on every row
#   expected  pass or fail per variant, with `why`, so a later gain is attributable
#   expect    facts that must all be in the top `top` results ([] = the row passes when nothing leaks)
#   leak      phrases that must not appear: future (said after as_of), stale (a replaced value returned as current),
#             excluded (excluded, deleted-only, revoked or hidden-call facts); every row also checks the other clients'
#             facts of `forbidden` and the facts of `excluded_facts`
#   state     C only: the status of the entity named by `name` at as_of (register task, superseded decision)
#   evidence  register or tracker: the fact is a register or Tracker fact (evidence recall, section 14.3)
#   shared    the fact is also stated by a deleted or moved source (shared facts kept, section 14.3)
#   dated     the matching item's said_at starts with this day (the content time rule)

version: 2
project: northpoint
top: 6

file_dates:                 # overlay files without a date in their path (noon local, as gold.yaml file_dates)
  docs/acme/pilot-launch-plan.md: 2026-11-06
  docs/acme/data-retention.md: 2026-11-06
  docs/acme/reporting-module.md: 2026-11-06
  docs/acme/mobile-rollout.md: 2026-11-06
  docs/acme/vendor-shortlist.md: 2026-11-05
  docs/acme/old-network-notes.md: 2026-10-01
  docs/acme/weekly-routine-old.md: 2026-10-01
  docs/acme/escalation-old.md: 2026-10-01
  docs/acme/escalation-contacts.md: 2026-11-02
  "_notion/Acme Security Review 55555555555555555555555555555555.md": 2026-11-09
  docs/globex/dashboard-plan.md: 2026-11-05
  docs/globex/change-control.md: 2026-11-05
  docs/globex/change-request-draft.md: 2026-11-12
  docs/initech/initech-kickoff.md: 2026-11-16

state:                      # what the bench does to the sources, and how the app would
  pm_excluded: [docs/acme/vendor-shortlist.md]                       # request exclude
  deleted: [docs/acme/old-network-notes.md, docs/acme/weekly-routine-old.md, docs/acme/escalation-old.md]
  revoked: ["55555555555555555555555555555555"]                       # --revoked (Notion page id; fake ids are one digit)
  hidden_calls: [2026-11-13-1000-acme-design-review.md]             # --hidden-calls
  moved: [live/2026-11-07-1100-acme-ops-sync.md]                     # call_layout.migrate between two passes
  supersede: {key: "notion:77777777777777777777777777777777", value: "notion:99999999999999999999999999999999",
              at: "2026-11-19T15:00:00Z"}
  tracker: v2/tracker.json

forbidden:                  # the other clients' unique facts: a client leak in any row of another client's scope
  acme: [["invoice export"], ["sample invoice file"], ["120 hours", "39 hours", "39 extra hours"], ["csv only"],
         ["steering group"], ["data migration"]]
  globex: [["sso"], ["rollout checklist"], ["december 8"], ["change freeze"], ["phase two"], ["field team track"],
           ["data migration"]]
  initech: [["invoice export"], ["sample invoice file"], ["steering group"], ["sso"], ["rollout checklist"],
            ["phase two"], ["field team track"], ["retention policy"]]

excluded_facts:             # one unique fact per denied or deleted-only source: never returned in any row
  - {id: pm-excluded, any: ["bluebird analytics"], how: excluded, in: docs/acme/vendor-shortlist.md}
  - {id: deleted, any: ["gateway-seven"], how: deleted, in: docs/acme/old-network-notes.md}
  - {id: revoked, any: ["penetration test window"], how: revoked, in: "_notion/Acme Security Review"}
  - {id: hidden-call, any: ["teal palette"], how: hidden, in: 2026-11-13-1000-acme-design-review}

