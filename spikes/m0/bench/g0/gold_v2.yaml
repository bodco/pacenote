      - {any: ["item 13 blocks the sso integration"], from: technical sync 2026-11-12 notes}
      - {any: ["waiting for client confirmation"], from: weekly status 2026-11-10 notes}
    expected: {A: fail, B: fail, C: pass}
    why: "Only 'pilot launch' is shared with the plan; the SSO and item 13 quotes share no word with the question, so word search finds one of three. C walks depends-on and blocks edges (S3 extraction)."
