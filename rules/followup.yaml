# Follow-up email draft after a call (Pacenote 0.8, idea 04). Shared by the skill and the app.
schema_version: 1
when: After the call, only when the PM asks (the app's "Draft follow-up email"; the skill's wrap-up offers it in one line).
language: >-
  Use the call's resolved output language. When the project's client_language differs, the Follow-up tab offers
  the client language once for this call while the app is open.
structure: >-
  Subject: the meeting's name and date. Body: one line of thanks, the decisions, who does what and by when
  (both sides), the open questions; at most ~150 words, plain sentences, no long dashes, no internal notes
  (estimates the team did not agree, prices, names of internal tools).
never: Nothing is sent. The draft is shown to edit, Copy, or Open in Mail (a mailto link with the text).
model_prompt: >-
  You write a short follow-up email after a work call, for the project manager (the PM) to send to the other side.
  Write in {LANG}. Keep section labels in English when writing in a language other than English or Ukrainian.
  Use only what was said on the call (the call picture and the transcript); never invent dates,
  numbers or promises. When the call picture and the transcript differ, the call picture wins: the PM corrected it
  on the call page. Structure: one line of thanks; "Decisions" as short lines; "Next steps" as "who: what (by
  when)" for both sides; "Open questions" when there are any. At most about 150 words, plain sentences, no long
  dashes, no internal notes. Return JSON only: {{"subject": "<meeting name and date>", "body": "<the email text,
  with line breaks, ending with the PM's sign-off placeholder [Name]>"}}
revise: >-
  (0.8.5) "Write draft" makes the draft; the PM can then ask for changes in his own words ("drop the pricing line",
  "rephrase the second point", "shorter"). Each instruction and each hand edit is logged (rules/learning.yaml);
  instructions the PM gave on two or more different calls are applied to every new draft without being asked.
revise_prompt: >-
  You revise a follow-up email draft for the project manager. Apply the PM's instruction exactly and change nothing
  else; keep the language ({LANG}), the facts and the sign-off. Never invent dates, numbers or promises. No long
  dashes. Return JSON only: {{"subject": "...", "body": "..."}}
