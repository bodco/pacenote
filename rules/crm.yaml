# CRM (Pacenote 0.8.7, block I). HubSpot first; any CRM plugs in through the same connector (CRMConnector) without
# changes to the preparation or the call page. Nothing is written to a CRM without the PM's click and a review of the
# changes. The key lives in the macOS Keychain only.
schema_version: 1
providers:
  hubspot:
    name: HubSpot
    auth: >-
      A Service key (HubSpot Settings > Development > Keys > Service Keys), sent as "Authorization: Bearer <key>".
      Legacy private apps are no longer offered to new accounts.
    base_url: https://api.hubapi.com
    scopes: [crm.objects.companies.read, crm.objects.companies.write, crm.objects.contacts.read,
             crm.objects.contacts.write, crm.objects.deals.read, crm.objects.deals.write, crm.objects.owners.read,
             crm.schemas.companies.read, crm.schemas.contacts.read, crm.schemas.deals.read]
    lead_scopes: [crm.objects.leads.read, crm.objects.leads.write]   # 0.27.1: asked for only while Leads are on
    api: v3 objects and search, associations v4, cursor pagination; 429 waits (Retry-After or 1, 2, 4 s) and retries 3 times
connector:
  read: [testConnection, findCompany(domain, name), findContacts(emails), deals(companyId), deal(id), recentActivity(refs, limit), pipelines, properties(objectType)]
  write: [createNote(text, associations), updateDeal(id, fields), createTask(subject, due, associations)]
  people: [findContacts(named, companyId), createCompany(name, domain), createContact(name, email, role, companyId), createLead(name, contactId, companyId), associateCall(callId, refs)]   # H3, CRMPeopleConnector
  errors: one line where the action was, never a modal
link:
  auto: >-
    The participants' emails from the calendar find contacts, their domains the company, and the company's open deal
    updated last is the deal. The Start call row "CRM: <company> · Deal: <deal>" changes it or sets No deal; the choice
    is kept for the series.
  meta: 'call metadata crm: {"provider", "companyId", "dealId", "contactIds"}'
snapshot:
  file: "<stem>.crm.md next to the brief"
  when: before a preparation, before a call starts and on Refresh; kept for offline use
  content: >-
    Company; deal (stage by name, amount, close date, owner, next step); contacts with roles; the last 10 activities
    in one line each; open tasks; the time it was taken.
write:
  where: '"Update HubSpot" in the call page''s ⋯ and on the end-of-call screen'
  review: >-
    Checkboxes: a note on the deal, the company and the contacts (summary, decisions, next steps, the Notion link when
    there is one; "Attach the transcript" off by default); deal fields (next step, close date when one was said, stage
    only when the PM picked one); qualification fields by the mapping; a follow-up task with a date. Texts come from
    the call page as the PM edited it.
  after: '"Updated in HubSpot · Open" and Undo for 8 s for what can be undone (deal fields back, the note and task deleted)'
  never: >-
    writes without the PM's click, except an object whose own Auto switch is on (Settings > Integrations > HubSpot >
    Sync, all off by default: the Call, contacts and companies, the PM's tasks after a call); notes and Meetings never
    write automatically
  auto: >-
    One switch per object, all off by default (Settings > Integrations > HubSpot > Sync: Calls, Tasks, Contacts and
    companies, Deals, Meetings), each the switch of the writer of that object. Calls: the Call engagement (title, start,
    duration, direction, outcome, participants, Summary and next steps, link back; never transcript text) is logged
    after the call ends, keyed by the Pacenote call id stored in <stem>.crm.json, so a re-run updates the same Call.
    Contacts and companies: the H3 switches (people). Tasks: the PM's open commitments of the call (rules/hubspot-tasks.yaml).
    Deals have no writer yet; Meetings never write automatically. Notes and the follow-up task never write without a click.
  people: >-
    H3: invitees are matched by email, then by name inside the company; the company by domain (never the PM's own or
    a free-mail domain). Missing contacts, the company and (opt in) Leads are rows in the review, unticked, with the
    name, email, job title and company filled in; Apply creates them before the Call, which is associated with them.
    Each create searches again first, so an existing email or domain is reused, never duplicated. Four switches, off
    by default (create contacts, create the company, propose Leads, create Leads), write only their own object after
    the call. Owners are never set. Leads need crm.objects.leads.read and crm.objects.leads.write.
  call: >-
    Call row in the review, ticked by default; associations contact 194, company 182, deal 206; dedupe by
    hs_call_external_id = pacenote:<call id>; Auto and Apply of one call take turns. <stem>.crm.json keeps the
    portalId; no write (Apply or Auto) when it differs from the portal of the key in use or is missing: Relink first.
    Full design: docs/specs/hubspot-crm-integration.md.
  meeting: >-
    H5: Meeting row, ticked by default, never automatic. The call page's Summary, Decisions and Next steps go to
    hs_internal_meeting_notes; associations contact 200, company 188, deal 212. A meeting on one of the call's contacts
    within 15 minutes of the start (HubSpot's calendar sync) is never written to without the PM's pick, even with the
    call's or the calendar event's title or start (the event may come from another meeting's reused sheet; those come
    first in the list). Nothing is written to a meeting until the PM picks one of those nearby or a new Meeting; the
    pick is kept with the call. Only a meeting already holding this call's block is used without asking. Only Pacenote's block for this call
    (bounded by start and end lines naming the call id) is written, and a re-run replaces just that block. Never
    transcript text. Writes take turns with the Call, Relink and Undo of the same call, read the stored link's portal
    and associations when their turn comes, and write nothing once the link names another portal.
  email: >-
    H5: Email row, never ticked for the PM, never automatic. Pacenote sends no mail; the PM ticks it after sending the
    follow-up, and an email engagement (hs_email_direction EMAIL, status SENT) with the subject and text as edited is
    logged; associations contact 198, company 186, deal 210. The id is kept with the call with whether Pacenote made it;
    an email HubSpot logged (one of the call's contacts, same subject, text holding the draft, last day) is never
    changed and only gets the missing associations.
  log: >-
    H6: <stem>.crm-log.json, one line per written object (time, object, action, source, HubSpot id, portal, property
    names, old values of an update, result); Retry for a failed line, only to its portal while the link names it; Undo of
    the latest write within 24 hours unless the record was changed in HubSpot since or the key now belongs to another
    portal (a Meeting keeps its own check of Pacenote's block). Never transcript text, never the key.
mapping:
  fields: H6, per object, each spec property to another writable property or "Don't write"; ids, owner and statuses fixed; Meetings and tasks in Tracker are never mapped
  owners: H6, a Pacenote user's email to a HubSpot owner; the user of this Mac uses the Matching owner
  qualification: for each criterion of the method, a deal property chosen by name in Settings > Integrations > HubSpot, or "Don't write"
