# Whisper hallucination and noise filters (to be moved here from live-transcriber's transcriber.py in M1).
schema_version: 1
drop_exact_lowercase:
  - "дякую за перегляд!"
  - "субтитри зроблені спільнотою"
  - "thanks for watching!"
  - "thank you."
  - "звучить музика"
drop_if_only_prompt_echo: true      # a line that only repeats the Whisper prompt words
echo_window_s: 1.5                  # speakers instead of headphones: a mic line that repeats a system line within N s is echo
never_languages: [ru]
# PB-30 (D56): the call language. Several languages: the main one is the most spoken so far (seconds of speech since
# the call start) after lang_warmup_s; before that the first language of the set. A language outside the set is
# decoded in the main one and the line is marked translated_from. Russian is never written: redone in the main one.
lang_warmup_s: 60
lang_foreign_min: 0.5               # detector probability from which a language outside the set is recognised
# Whisper stop-phrases on silence: dropped only for a short line in near-silence (the same words in a normal voice stay).
silence_max_s: 2.5
silence_rms: 0.01
silence_stop_phrases:
  - "дякую"
  - "дякую за перегляд"
  - "дякую за увагу"
  - "дякуємо за перегляд"
  - "дякую вам"
  - "всім дякую"
  - "до побачення"
  - "до зустрічі"
  - "продовження буде"
  - "так"
  - "ага"
  - "добре"
  - "thank you"
  - "thanks"
  - "thank you very much"
  - "thanks for watching"
  - "thank you for watching"
  - "bye"
  - "bye bye"
  - "you"
  - "okay"
  - "ok"
  - "see you"
